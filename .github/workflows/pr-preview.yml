name: PR Preview

# PR ごとに gh-pages の pr-preview/pr-<番号>/ へサイトを配信し、
# プレビュー URL を PR にコメントする。PR を閉じると自動で削除される。

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        if: github.event.action != 'closed'
        run: |
          mkdir -p _site
          rsync -a index.html css js images .nojekyll _site/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
